name: Poll stock every 15s

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  # Start polling as soon as a new tracker config is pushed
  push:
    branches: [main]

# A new run takes over from the previous one so hits don't double up,
# and each run loops for up to ~6h, so late or skipped scheduled starts leave no gap.
concurrency:
  group: poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Hit /api/poll every 15 seconds
        run: |
          # my1pick #512 sale ends 2026-11-09 23:59 KST; stop polling 10 min later (= 2026-11-09 15:09 UTC)
          event_end=$(date -u -d '2026-11-09 15:09:00' +%s)
          if [ "$(date -u +%s)" -ge "$event_end" ]; then echo "Event over, nothing to poll."; exit 0; fi
          end=$((SECONDS + 350*60))
          while [ $SECONDS -lt $end ] && [ "$(date -u +%s)" -lt "$event_end" ]; do
            curl -s --max-time 10 "https://kumix.vercel.app/api/poll" || true
            echo ""
            sleep 15
          done
