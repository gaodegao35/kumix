<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUHZ Video Fansign — Sales Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; padding: 32px 24px; }
    a { color: inherit; text-decoration: none; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
    .hint { font-size: 12px; color: #aaa; margin-top: 16px; }
    .warning { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #92400e; margin-bottom: 20px; display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; }
    .status-bar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; margin-bottom: 20px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .dot.active { background: #16a34a; }
    .dot.error  { background: #dc2626; }
    .next-refresh { font-size: 12px; color: #aaa; margin-left: auto; }
    .section-label { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.1em; margin: 20px 0 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 18px 20px; display: block; transition: border-color 0.2s, box-shadow 0.2s; }
    .card:hover { border-color: #aaa; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card.changed { border-color: #16a34a; }
    .member-name { font-size: 11px; font-weight: 700; color: #888; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .arrow { font-size: 14px; color: #ccc; }
    .sales-row { display: flex; align-items: baseline; gap: 8px; }
    .sales-count { font-size: 32px; font-weight: 800; color: #111; line-height: 1; }
    .sales-label { font-size: 12px; color: #aaa; }
    .stock-sub { font-size: 11px; color: #bbb; margin-top: 5px; }
    .delta-badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 5px; padding: 1px 7px; margin-top: 6px; opacity: 0; transition: opacity 0.3s; }
    .delta-badge.up   { color: #16a34a; background: #dcfce7; }
    .delta-badge.down { color: #dc2626; background: #fee2e2; }
    .delta-badge.visible { opacity: 1; }
  </style>
</head>
<body>
  <h1>YUHZ 1ST EP [B] · 团体视频签售 (10/26)</h1>
  <p class="subtitle" id="subtitle">Weidian #7872096927 · Updates every 15s</p>

  <div class="warning">
    <span>⚠</span>
    <span>Sold = 999,999,999 − current stock. If the shop restocks or the real starting stock differs, counts will be off.</span>
  </div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-text">Connecting...</span>
    <span class="next-refresh" id="next-refresh"></span>
  </div>

  <div class="grid" id="grid"></div>
  <p class="hint" id="hint"></p>

  <script>
    const INTERVAL = 15000;
    const OPTIONS = [
      { slug: 'weidian', title: 'WEIDIAN · 团体视频签售' }
    ];

    let prevSales = {}, countdownTimer;
    function fmt(n) { return n.toLocaleString(); }

    function buildGrid() {
      OPTIONS.forEach(opt => {
        const card = document.createElement('a');
        card.className = 'card';
        card.id = 'card-' + opt.slug;
        card.href = '/option/' + opt.slug;
        card.innerHTML = `
          <div class="member-name">${opt.title}<span class="arrow">→</span></div>
          <div class="sales-row">
            <div class="sales-count" id="sales-${opt.slug}">—</div>
            <div class="sales-label">sold</div>
          </div>
          <div class="stock-sub" id="stock-${opt.slug}"></div>
          <div class="delta-badge" id="badge-${opt.slug}"></div>`;
        document.getElementById('grid').appendChild(card);
      });
    }

    function updateCard(opt) {
      if (opt.sold === null) return;
      document.getElementById('sales-' + opt.slug).textContent = fmt(opt.sold);
      document.getElementById('stock-' + opt.slug).textContent = fmt(opt.stock) + ' left of ' + fmt(opt.base);
      const prev = prevSales[opt.slug];
      if (prev !== undefined && opt.sold !== prev) {
        const delta = opt.sold - prev;
        const badge = document.getElementById('badge-' + opt.slug);
        const card  = document.getElementById('card-'  + opt.slug);
        badge.textContent = (delta > 0 ? '+' : '') + fmt(delta);
        badge.className = 'delta-badge visible ' + (delta > 0 ? 'up' : 'down');
        card.classList.add('changed');
        setTimeout(() => { badge.classList.remove('visible'); card.classList.remove('changed'); }, 5000);
      }
      prevSales[opt.slug] = opt.sold;
    }

    function setStatus(ok, text) {
      document.getElementById('dot').className = 'dot ' + (ok ? 'active' : 'error');
      document.getElementById('status-text').textContent = text;
    }

    function startCountdown() {
      clearInterval(countdownTimer);
      let c = INTERVAL / 1000;
      const el = document.getElementById('next-refresh');
      el.textContent = 'Next refresh in ' + c + 's';
      countdownTimer = setInterval(() => {
        c--;
        el.textContent = c > 0 ? 'Next refresh in ' + c + 's' : 'Refreshing...';
        if (c <= 0) clearInterval(countdownTimer);
      }, 1000);
    }

    async function fetchStock() {
      try {
        const data = await fetch('/api/poll', { cache: 'no-store' }).then(r => r.json());
        if (data.error) throw new Error(data.error);
        data.options.forEach(updateCard);
        const p = data.product;
        document.getElementById('subtitle').textContent =
          'Weidian #' + p.id + ' · ' + p.name + ' · ¥' + p.price + ' · Updates every 15s';
        document.getElementById('hint').textContent = data.redisError ? 'History logging unavailable: ' + data.redisError : '';
        setStatus(true, 'Live · ' + data.ts.split(' ')[1] + ' KST');
      } catch (e) { setStatus(false, 'Error: ' + e.message); }
      startCountdown();
    }

    buildGrid();
    fetchStock();
    setInterval(fetchStock, INTERVAL);
  </script>
</body>
</html>
