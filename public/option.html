<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option Sold Log</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; padding: 32px 24px; }
    a { color: inherit; text-decoration: none; }
    .back { font-size: 13px; color: #888; display: inline-block; margin-bottom: 20px; transition: color 0.2s; }
    .back:hover { color: #333; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
    .meta { font-size: 13px; color: #888; margin-bottom: 16px; }
    .status-bar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; margin-bottom: 20px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .dot.active { background: #16a34a; }
    .dot.error  { background: #dc2626; }
    .next-refresh { font-size: 12px; color: #aaa; margin-left: auto; }
    .summary { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .summary-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 14px 18px; min-width: 140px; }
    .summary-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .summary-value { font-size: 26px; font-weight: 800; color: #111; }
    .summary-sub { font-size: 12px; color: #aaa; margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e0e0e0; }
    caption { text-align: left; font-size: 15px; font-weight: 700; padding: 14px 16px 10px; background: #fff; border: 1px solid #e0e0e0; border-bottom: none; border-radius: 10px 10px 0 0; }
    th { text-align: left; font-size: 13px; font-weight: 700; padding: 10px 16px; background: #fff; border-bottom: 2px solid #e0e0e0; color: #111; }
    th:last-child, td:last-child { text-align: right; }
    caption { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .sort-btn { font: inherit; font-size: 12px; font-weight: 600; color: #333; background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
    .sort-btn:hover { border-color: #aaa; }
    .sort-btn.active { color: #fff; background: #111; border-color: #111; }
    th.seq, td.seq { width: 1%; color: #aaa; font-variant-numeric: tabular-nums; white-space: nowrap; }
    td { padding: 9px 16px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #f0f0f0; color: #111; }
    tr:last-child td { border-bottom: none; }
    td.ts { font-variant-numeric: tabular-nums; color: #333; }
    td.sold-val { font-variant-numeric: tabular-nums; }
    td.delta { font-variant-numeric: tabular-nums; text-align: right; }
    td.delta.up   { color: #16a34a; }
    td.delta.down { color: #dc2626; }
    td.delta.zero { color: #aaa; }
    td.empty { color: #aaa; font-weight: 400; text-align: left !important; }
  </style>
</head>
<body>
  <a class="back" id="back-link" href="/">← All Options</a>
  <h1 id="page-title">—</h1>
  <p class="meta" id="page-meta"></p>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-text">Connecting...</span>
    <span class="next-refresh" id="next-refresh"></span>
  </div>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-label">Total Sold</div>
      <div class="summary-value" id="sum-sold">—</div>
      <div class="summary-sub" id="sum-sold-sub">of — total stock</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Last Change</div>
      <div class="summary-value" id="sum-delta">—</div>
      <div class="summary-sub" id="sum-delta-time">&nbsp;</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Stock Left</div>
      <div class="summary-value" id="sum-stock">—</div>
      <div class="summary-sub" id="sum-stock-sub">of —</div>
    </div>
  </div>

  <table>
    <caption><span id="table-caption">sold_log</span><button class="sort-btn" id="sort-btn" type="button">Sort: change high → low</button></caption>
    <thead><tr><th class="seq">#</th><th>timestamp</th><th>sold</th><th>change</th></tr></thead>
    <tbody id="log-body"></tbody>
  </table>

  <script>
    const INTERVAL = 15000;
    const SLUG = decodeURIComponent(window.location.pathname.split('/')[2] || '').toLowerCase();

    let countdownTimer, found = true;
    let lastEntries = null, sortByChange = false;
    function fmt(n) { return n.toLocaleString(); }

    function setStatus(ok, text) {
      document.getElementById('dot').className = 'dot ' + (ok ? 'active' : 'error');
      document.getElementById('status-text').textContent = text;
    }

    function startCountdown() {
      clearInterval(countdownTimer);
      let c = INTERVAL / 1000;
      const el = document.getElementById('next-refresh');
      el.textContent = 'Next refresh in ' + c + 's';
      countdownTimer = setInterval(() => {
        c--;
        el.textContent = c > 0 ? 'Next refresh in ' + c + 's' : 'Refreshing...';
        if (c <= 0) clearInterval(countdownTimer);
      }, 1000);
    }

    function renderHeader(opt, product) {
      document.title = opt.name + ' sold_log · YUHZ Video Fansign';
      document.getElementById('page-title').textContent = opt.name + '-sold_log';
      document.getElementById('page-meta').textContent =
        opt.label + (opt.itemId ? ' · Weidian #' + opt.itemId : '') + ' · Starting stock: ' + fmt(opt.base);
      document.getElementById('table-caption').textContent = opt.name + '-sold_log (KST)';
      document.getElementById('sum-sold').textContent = fmt(opt.sold);
      document.getElementById('sum-sold-sub').textContent = 'of ' + fmt(opt.base) + ' starting stock';
      document.getElementById('sum-stock').textContent = fmt(opt.stock);
      document.getElementById('sum-stock-sub').textContent = 'of ' + fmt(opt.base);
    }

    function renderHistory(entries) {
      lastEntries = entries;
      const tbody = document.getElementById('log-body');
      if (!Array.isArray(entries)) {
        tbody.innerHTML = '<tr><td class="empty" colspan="4">History unavailable: ' + (entries.error || 'unknown error') + '</td></tr>';
        return;
      }
      if (!entries.length) {
        tbody.innerHTML = '<tr><td class="empty" colspan="4">No changes logged yet.</td></tr>';
        return;
      }
      // entries arrive newest first; # counts up from the oldest and stays with its row when sorted
      let rows = entries.map((e, i) => ({ ...e, seq: entries.length - i }));
      if (sortByChange) rows = [...rows].sort((a, b) => (b.delta ?? -Infinity) - (a.delta ?? -Infinity) || b.seq - a.seq);
      tbody.innerHTML = rows.map(e => {
        let dc = 'delta zero', dt = '—';
        if (e.delta > 0)      { dc = 'delta up';   dt = '+' + fmt(e.delta); }
        else if (e.delta < 0) { dc = 'delta down'; dt = fmt(e.delta); }
        return '<tr><td class="seq">' + e.seq + '</td><td class="ts">' + e.ts + '</td><td class="sold-val">' + fmt(e.sold) + '</td><td class="' + dc + '">' + dt + '</td></tr>';
      }).join('');
      const last = entries.find(e => e.delta !== null && e.delta !== 0);
      if (last) {
        const el = document.getElementById('sum-delta');
        el.textContent = (last.delta > 0 ? '+' : '') + fmt(last.delta);
        el.style.color = last.delta > 0 ? '#16a34a' : '#dc2626';
        document.getElementById('sum-delta-time').textContent = 'at ' + last.ts.split(' ')[1] + ' KST';
      }
    }

    async function refresh() {
      if (!found) return;
      try {
        // Poll first so the latest change is logged before the history is read
        const data = await fetch('/api/poll', { cache: 'no-store' }).then(r => r.json());
        if (data.error) throw new Error(data.error);
        const opt = data.options.find(o => o.slug === SLUG);
        if (!opt) {
          found = false;
          document.body.innerHTML = '<p style="padding:32px;color:#888">Not found. <a href="/">← Back</a></p>';
          return;
        }
        if (opt.sold === null) throw new Error('stock missing from Weidian response');
        renderHeader(opt, data.product);
        const history = await fetch('/api/history?option=' + SLUG, { cache: 'no-store' })
          .then(r => r.json()).catch(e => ({ error: e.message }));
        renderHistory(history);
        setStatus(true, 'Live · ' + data.ts.split(' ')[1] + ' KST');
      } catch (e) { setStatus(false, 'Error: ' + e.message); }
      startCountdown();
    }

    document.getElementById('sort-btn').addEventListener('click', e => {
      sortByChange = !sortByChange;
      e.currentTarget.classList.toggle('active', sortByChange);
      e.currentTarget.textContent = sortByChange ? 'Sort: newest first' : 'Sort: change high → low';
      if (lastEntries) renderHistory(lastEntries);
    });

    refresh();
    setInterval(refresh, INTERVAL);
  </script>
</body>
</html>
